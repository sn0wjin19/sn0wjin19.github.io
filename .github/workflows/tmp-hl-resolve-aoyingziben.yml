name: tmp-hl-resolve-aoyingziben
on:
  push:
    branches:
      - tmp-hl-resolve-aoyingziben-20260905

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve historical ZEC orders via explorer
        shell: bash
        run: |
          node --version
          npm install --silent @nktkas/hyperliquid
          cat > resolve.mjs <<'JS'
          import { HttpTransport, WebSocketTransport, ExplorerClient } from '@nktkas/hyperliquid';

          const BUILDER='0x2a2b6b093a9813fbd8cddae800c3d17d46460d17';
          const targetTimes=[
            ['open1', Date.parse('2026-09-04T20:52:00Z')],
            ['close1',Date.parse('2026-09-04T21:10:00Z')],
            ['open2', Date.parse('2026-09-04T21:23:00Z')],
            ['close2',Date.parse('2026-09-05T00:12:00Z')],
          ];

          const wsTransport=new WebSocketTransport({url:'wss://rpc.hyperliquid.xyz/ws'});
          const wsClient=new ExplorerClient({transport:wsTransport});
          const latest=await new Promise(async (resolve,reject)=>{
            const timer=setTimeout(()=>reject(new Error('explorerBlock timeout')),15000);
            let sub;
            sub=await wsClient.explorerBlock((data)=>{
              if (!Array.isArray(data)||!data.length) return;
              const b=data[data.length-1];
              clearTimeout(timer);
              resolve(b);
              queueMicrotask(()=>sub?.unsubscribe?.().catch?.(()=>{}));
            },reject);
          });
          console.log('LATEST',JSON.stringify(latest));

          const httpTransport=new HttpTransport();
          const client=new ExplorerClient({transport:httpTransport});
          const cache=new Map();
          async function block(height){
            if(cache.has(height)) return cache.get(height);
            const r=await client.blockDetails({height});
            const b=r.blockDetails;
            cache.set(height,b);
            return b;
          }
          async function findHeightAtOrBefore(ts){
            let lo=1, hi=latest.height;
            while(lo<hi){
              const mid=Math.ceil((lo+hi)/2);
              let b;
              try { b=await block(mid); } catch(e){ hi=mid-1; continue; }
              if(Number(b.blockTime)<=ts) lo=mid; else hi=mid-1;
            }
            return lo;
          }
          function collectAddresses(obj, path='', out=[]){
            if(obj==null) return out;
            if(typeof obj==='string'){
              if(/^0x[a-fA-F0-9]{40}$/.test(obj)) out.push([path,obj.toLowerCase()]);
              return out;
            }
            if(Array.isArray(obj)){ obj.forEach((v,i)=>collectAddresses(v,`${path}[${i}]`,out)); return out; }
            if(typeof obj==='object'){ for(const [k,v] of Object.entries(obj)) collectAddresses(v,path?`${path}.${k}`:k,out); }
            return out;
          }
          function containsBuilder(tx){ return JSON.stringify(tx).toLowerCase().includes(BUILDER); }
          function looksZec(tx){ return JSON.stringify(tx).toUpperCase().includes('ZEC'); }
          function looksOrder(tx){ const s=JSON.stringify(tx).toLowerCase(); return s.includes('order') || s.includes('orders'); }

          for(const [name,ts] of targetTimes){
            const h=await findHeightAtOrBefore(ts);
            const center=await block(h);
            console.log('\nTARGET',name,new Date(ts).toISOString(),'HEIGHT',h,'BLOCKTIME',new Date(Number(center.blockTime)).toISOString(),'TXS',center.numTxs);
            const hits=[];
            for(let dh=-500;dh<=500;dh++){
              const hh=h+dh; if(hh<1||hh>latest.height) continue;
              let b; try{b=await block(hh);}catch{continue;}
              const dt=Number(b.blockTime)-ts;
              if(dt < -120000 || dt > 120000) continue;
              for(const tx of b.txs||[]){
                if(containsBuilder(tx) && looksOrder(tx)) hits.push({height:hh,blockTime:b.blockTime,dt,zec:looksZec(tx),tx});
              }
            }
            console.log('BUILDER_ORDER_HITS',hits.length,'ZEC_BUILDER_HITS',hits.filter(x=>x.zec).length);
            for(const x of hits.filter(x=>x.zec).slice(0,80)){
              console.log('HIT',name,'dt_ms',x.dt,'height',x.height,'addresses',JSON.stringify(collectAddresses(x.tx)),'tx',JSON.stringify(x.tx).slice(0,5000));
            }
          }
          JS
          node resolve.mjs
