name: tmp-hl-resolve-aoyingziben
on:
  push:
    branches:
      - tmp-hl-resolve-aoyingziben-20260905

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Probe recent ZEC trades
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from datetime import datetime, timezone

          events=[
            ('open1','2026-09-04T20:52:00+00:00','A',1186.180233463035),
            ('close1','2026-09-04T21:10:00+00:00','B',225.10),
            ('open2','2026-09-04T21:23:00+00:00','A',202.6200019495),
            ('close2','2026-09-05T00:12:00+00:00','B',139.46999707),
          ]
          ev=[(n,int(datetime.fromisoformat(t).timestamp()*1000),s,z) for n,t,s,z in events]
          r=requests.post('https://api.hyperliquid.xyz/info',json={'type':'recentTrades','coin':'ZEC'},timeout=30)
          print('HTTP',r.status_code)
          print('BODY_PREFIX',r.text[:500])
          r.raise_for_status()
          xs=r.json()
          print('COUNT',len(xs))
          if xs:
            times=[int(x['time']) for x in xs]
            print('OLDEST',datetime.fromtimestamp(min(times)/1000,timezone.utc).isoformat())
            print('NEWEST',datetime.fromtimestamp(max(times)/1000,timezone.utc).isoformat())
            print('USERS_FIELD',sum(1 for x in xs if x.get('users')),'/',len(xs))
          for name,t,side,target in ev:
            print('\nEVENT',name,datetime.fromtimestamp(t/1000,timezone.utc).isoformat(),side,target)
            mm=[x for x in xs if x.get('side')==side and abs(int(x['time'])-t)<=10*60_000]
            mm.sort(key=lambda x:abs(int(x['time'])-t))
            print('MATCH_COUNT',len(mm))
            for x in mm[:40]:
              print(' ',datetime.fromtimestamp(int(x['time'])/1000,timezone.utc).isoformat(),x.get('side'),x.get('px'),x.get('sz'),x.get('users'),x.get('hash'),x.get('tid'))
          PY
